name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x bin/dotfiles lib/bash_helpers test/smoke.sh

  smoke:
    strategy:
      matrix:
        # macOS runs the scripts under /bin/bash 3.2, the oldest bash we support
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: smoke test
        run: /bin/bash test/smoke.sh
